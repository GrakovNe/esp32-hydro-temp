<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroTemp</title>
<style>
:root {
  --bg:#FAFAFA; --text:#1C1B1F; --muted:#6B6B70; --faint:#A0A0A5; --line:#E2E2E5; --line2:#EEEEF0;
  --accent:#FF6F3F; --error:#C62828;
  --good:#3F9E5B; --bad:#D64545; --cold:#4A7FD4; --none:#C4C4C8; --track:#E6E6E9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1C1B1F; --text:#E6E1E5; --muted:#A3A0A8; --faint:#6C6971; --line:#2F2E34; --line2:#28272C;
    --accent:#D96A3E; --error:#F2726D;
    --good:#5BBF78; --bad:#F27B7B; --cold:#7FA6F0; --none:#55535A; --track:#2A292E;
  }
}
* { box-sizing:border-box; }
html, body { margin:0; }
body { min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
       font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
       -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
.num { font-variant-numeric:tabular-nums; }
.wrap { width:100%; max-width:1040px; margin:0 auto; padding:0 32px; }
@media (max-width:640px) { .wrap { padding:0 20px; } }

header { border-bottom:1px solid var(--line); }
header .wrap { display:flex; align-items:center; height:56px; gap:28px; }
header .name { font-weight:600; font-size:15px; flex:1; letter-spacing:-.01em; }
nav { display:flex; gap:22px; height:100%; }
nav a { display:flex; align-items:center; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
nav a.on { color:var(--text); border-bottom-color:var(--accent); }

.lab { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }

.readings { display:grid; grid-template-columns:1fr 1fr; gap:0 48px; padding:36px 0 32px; border-bottom:1px solid var(--line); }
.readings > div + div { border-left:1px solid var(--line); padding-left:48px; }
@media (max-width:760px) {
  .readings { grid-template-columns:1fr; gap:28px 0; padding:28px 0 24px; }
  .readings > div + div { border-left:0; padding-left:0; }
}
.v { display:flex; align-items:baseline; gap:12px; margin-top:10px; }
.big { font-size:104px; font-weight:500; line-height:.95; letter-spacing:-.05em; }
.unit { font-size:22px; color:var(--muted); }
@media (max-width:640px) { .big { font-size:88px; } }
.d { font-size:14px; color:var(--muted); margin-top:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:20px; }
.d.err { color:var(--error); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--none); flex:none; }
.dot.good { background:var(--good); } .dot.bad { background:var(--bad); } .dot.cold { background:var(--cold); }
.track { position:relative; height:3px; background:var(--track); margin-top:18px; }
.track .fill { position:absolute; left:0; top:0; bottom:0; background:var(--none); transition:width .4s ease; }
.track .fill.good { background:var(--good); } .track .fill.bad { background:var(--bad); } .track .fill.cold { background:var(--cold); }
.track .tick { position:absolute; top:-3px; width:1px; height:9px; background:var(--faint); }
.ticks { position:relative; height:14px; font-size:11px; color:var(--faint); margin-top:6px; }
.ticks span { position:absolute; transform:translateX(-50%); }

.chart-sec { padding:28px 0 36px; }
.chart-block { margin-top:18px; }
.chart-block + .chart-block { margin-top:28px; border-top:1px solid var(--line2); padding-top:22px; }
.sub { font-size:13px; color:var(--muted); }
.chart-wrap { position:relative; margin-top:8px; }
svg.chart { width:100%; height:190px; display:block; touch-action:pan-y; }
@media (max-width:640px) { svg.chart { height:160px; } }
/* Chrome applies CSS width/height to SVG rects: no shared class names with sized elements. */
svg .bar { opacity:.9; } svg .bar.hi { opacity:1; }
svg .bar.good { fill:var(--good); } svg .bar.bad { fill:var(--bad); } svg .bar.cold { fill:var(--cold); }
svg .base { stroke:var(--line); stroke-width:1; }
svg .zone { stroke:var(--faint); stroke-width:1; stroke-dasharray:2 4; opacity:.6; }
svg text { fill:var(--faint); font-size:11px; font-variant-numeric:tabular-nums; }
svg .cursor { stroke:var(--text); stroke-width:1; opacity:.4; }
.tip { position:absolute; top:0; pointer-events:none; display:none; font-size:12.5px; color:var(--text); background:var(--bg); padding:0 6px; white-space:nowrap; transform:translateX(-50%); }
.tip b { font-weight:600; }
.stats { font-size:13px; color:var(--muted); display:flex; gap:20px; margin-top:6px; min-height:19px; }
.stats b { color:var(--text); font-weight:500; }

footer { border-top:1px solid var(--line); margin-top:auto; padding:18px 0 28px; font-size:12.5px; color:var(--faint); }
footer .l { text-align:center; }
footer .l + .l { margin-top:4px; }
footer .err { color:var(--error); }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="name" id="devname">HydroTemp</div>
  <nav><a class="on" href="/main">Dashboard</a><a href="/config">Settings</a><a href="/info">Device Info</a></nav>
</div></header>

<main class="wrap">
  <section class="readings">
    <div>
      <div class="lab" id="lab0">Sensor 1</div>
      <div class="v"><span class="big num" id="t0">—</span><span class="unit">°C</span></div>
      <div class="d" id="t0d"></div>
      <div class="track"><div class="fill" id="t0fill" style="width:0"></div><div class="tick" style="left:33.3%"></div><div class="tick" style="left:66.7%"></div></div>
      <div class="ticks" id="t0ticks"></div>
    </div>
    <div>
      <div class="lab" id="lab1">Sensor 2</div>
      <div class="v"><span class="big num" id="t1">—</span><span class="unit">°C</span></div>
      <div class="d" id="t1d"></div>
      <div class="track"><div class="fill" id="t1fill" style="width:0"></div><div class="tick" style="left:33.3%"></div><div class="tick" style="left:66.7%"></div></div>
      <div class="ticks" id="t1ticks"></div>
    </div>
  </section>

  <section class="chart-sec">
    <div class="lab">Last 24 hours</div>
    <div class="chart-block">
      <div class="sub" id="sub0">Sensor 1</div>
      <div class="chart-wrap"><svg class="chart" id="chart-0"></svg><div class="tip" id="tip-0"></div></div>
      <div class="stats" id="stats-0"></div>
    </div>
    <div class="chart-block">
      <div class="sub" id="sub1">Sensor 2</div>
      <div class="chart-wrap"><svg class="chart" id="chart-1"></svg><div class="tip" id="tip-1"></div></div>
      <div class="stats" id="stats-1"></div>
    </div>
  </section>
</main>

<footer><div class="wrap">
  <div class="l"><span id="upd">Connecting…</span><span id="fw"></span></div>
  <div class="l">© 2026 Max Grakov, Saint Petersburg · MIT License</div>
</div></footer>

<script>
"use strict";
const $ = id => document.getElementById(id);

const BUCKET_S = 1800, BUCKETS = 48;
const WORD = { good: "In range", bad: "Too warm", cold: "Too cold" };

let records = [];
let sensors = [];
let last = null;
let unreachable = false;

const pad = n => String(n).padStart(2, "0");
const hhmm = t => { const d = new Date(t * 1000); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const desc = parts => parts.map(p => "<span>" + p + "</span>").join("<span>·</span>");
const ago = s => s < 60 ? s + " s ago" : s < 3600 ? Math.floor(s / 60) + " min ago" : Math.floor(s / 3600) + " h ago";
/* Same rounding as the firmware: hundredths to a tenth, half away from zero. */
const fmt1 = v => { const h = Math.round(v * 100), t = h >= 0 ? Math.floor((h + 5) / 10) : -Math.floor((-h + 5) / 10); return (t / 10).toFixed(1); };
const zone = (v, s) => v < s.low ? "cold" : v > s.high ? "bad" : "good";
/* The track spans one range width on each side of the allowed range,
 * so the allowed band always sits in its middle third. */
const trackLo = s => s.low - (s.high - s.low);
const trackSpan = s => 3 * (s.high - s.low);
const every = s => s < 60 ? s + " s" : s % 60 ? (s / 60).toFixed(1) + " min" : s / 60 + " min";

function renderReading(i, s) {
  const d = $("t" + i + "d"), fill = $("t" + i + "fill");
  $("lab" + i).textContent = s.name;
  $("sub" + i).textContent = s.name;
  $("t" + i + "ticks").innerHTML =
    '<span style="left:0;transform:none">' + fmt1(trackLo(s)) + "</span>" +
    '<span style="left:33.3%">' + fmt1(s.low) + "</span>" +
    '<span style="left:66.7%">' + fmt1(s.high) + "</span>" +
    '<span style="left:100%;transform:translateX(-100%)">' + fmt1(trackLo(s) + trackSpan(s)) + "</span>";
  if (s.temperature != null) {
    /* The verdict comes from the device; low/high only tell cold from warm. */
    const z = !s.out_of_range ? "good" : s.temperature < s.low ? "cold" : "bad";
    $("t" + i).textContent = fmt1(s.temperature);
    d.className = "d";
    d.innerHTML = '<span class="dot ' + z + '"></span>' + desc([WORD[z], ago(s.age_s)]);
    fill.className = "fill " + z;
    fill.style.width = Math.max(0, Math.min(100, (s.temperature - trackLo(s)) / trackSpan(s) * 100)) + "%";
  } else {
    $("t" + i).textContent = "—";
    d.className = "d" + (s.present ? "" : " err");
    d.innerHTML = '<span class="dot"></span>' + desc(s.present ? ["No data yet"] : ["No data", "sensor not found"]);
    fill.className = "fill";
    fill.style.width = "0";
  }
}

function renderCurrent(j) {
  if (!j || !j.sensors) return;
  last = j;
  sensors = j.sensors;
  j.sensors.forEach((s, i) => renderReading(i, s));
  renderFooter();
}

function renderFooter() {
  const el = $("upd");
  if (unreachable) {
    el.textContent = "Device not reachable";
    el.className = "err";
    return;
  }
  const when = last && last.timestamp ? new Date(last.timestamp * 1000) : new Date();
  let t = "Updated " + when.toTimeString().slice(0, 8);
  if (last && last.poll_interval_s) t += " · polled every " + every(last.poll_interval_s);
  if (last && !last.time_synced) t += " · clock not synced";
  el.textContent = t;
  el.className = "";
}

async function loadCurrent() {
  try {
    const r = await fetch("/api/v1/current");
    const j = await r.json();
    unreachable = false;
    renderCurrent(j);
    drawCharts();
  } catch (e) {
    unreachable = true;
    renderFooter();
  }
}

async function loadHistory() {
  try {
    const r = await fetch("/api/v1/history");
    const j = await r.json();
    records = j.records || [];
    drawCharts();
  } catch (e) {  }
}

async function loadStatus() {
  try {
    const r = await fetch("/api/v1/status");
    const j = await r.json();
    if (j.device) {
      document.title = j.device.name;
      $("devname").textContent = j.device.name;
      $("fw").textContent = " · Firmware " + j.device.firmware + " · ESP-IDF " + j.device.idf;
    }
  } catch (e) {  }
}

const HIST = {};
function drawChart(i) {
  const svg = $("chart-" + i), stats = $("stats-" + i), s = sensors[i];
  const now = Date.now() / 1000, start = Math.floor(now / BUCKET_S) * BUCKET_S - (BUCKETS - 1) * BUCKET_S;
  const buckets = new Array(BUCKETS).fill(null);
  for (const r of records) {
    const v = r.v[i];
    if (v == null) continue;
    const k = Math.floor((r.t - start) / BUCKET_S);
    if (k < 0 || k >= BUCKETS) continue;
    if (!buckets[k]) buckets[k] = { sum: 0, n: 0 };
    buckets[k].sum += v; buckets[k].n++;
  }
  const vals = buckets.filter(x => x).map(x => x.sum / x.n);
  if (!vals.length || !s) { svg.innerHTML = ""; stats.textContent = "No history yet"; HIST[i] = null; return; }
  const box = svg.getBoundingClientRect();
  const W = Math.round(box.width) || 800, H = Math.round(box.height) || 190;
  const top = 14, bottom = 28, right = 40, pw = W - right, ph = H - top - bottom;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const lo = Math.floor(Math.min(...vals, s.low) - 1), hi = Math.ceil(Math.max(...vals, s.high) + 1);
  const y = v => top + (1 - (v - lo) / (hi - lo)) * ph, bw = pw / BUCKETS;
  let out = "";
  for (const z of [s.low, s.high]) {
    if (z > lo && z < hi) {
      out += '<line class="zone" x1="0" x2="' + pw + '" y1="' + y(z) + '" y2="' + y(z) + '"/>' +
             '<text x="' + (pw + 10) + '" y="' + (y(z) + 4) + '">' + fmt1(z) + "</text>";
    }
  }
  for (let k = 0; k < BUCKETS; k++) {
    if (!buckets[k]) continue;
    const avg = buckets[k].sum / buckets[k].n, h = Math.max(2, y(lo) - y(avg));
    out += '<rect class="bar ' + zone(avg, s) + '" data-i="' + k +
           '" x="' + (k * bw + 2) + '" y="' + (y(lo) - h) + '" width="' + (bw - 4) + '" height="' + h + '"/>';
  }
  out += '<line class="base" x1="0" x2="' + pw + '" y1="' + (y(lo) + .5) + '" y2="' + (y(lo) + .5) + '"/>';
  for (let k = 0; k < BUCKETS; k++) {
    const d = new Date((start + k * BUCKET_S) * 1000);
    if (d.getMinutes() === 0 && d.getHours() % 6 === 0 && k * bw < pw - 84) {
      out += '<text x="' + (k * bw + 2) + '" y="' + (H - 8) + '">' + pad(d.getHours()) + ":00</text>";
    }
  }
  out += '<text x="' + (pw - 24) + '" y="' + (H - 8) + '">now</text>';
  out += '<line class="cursor" y1="' + top + '" y2="' + y(lo) + '" style="display:none"/>';
  svg.innerHTML = out;
  HIST[i] = { start, buckets, pw, bw };
  const mn = Math.min(...vals), mx = Math.max(...vals), av = vals.reduce((a, b) => a + b, 0) / vals.length;
  stats.innerHTML = "<span>min <b>" + fmt1(mn) + "</b></span><span>avg <b>" + fmt1(av) + "</b></span><span>max <b>" + fmt1(mx) + " °C</b></span>";
}
function drawCharts() { drawChart(0); drawChart(1); }

function tooltip(i) {
  const svg = $("chart-" + i), tip = $("tip-" + i);
  function at(x0) {
    const h = HIST[i];
    if (!h) return;
    const r = svg.getBoundingClientRect();
    const k = Math.max(0, Math.min(BUCKETS - 1, Math.floor((x0 - r.left) / h.pw * BUCKETS))), sl = h.buckets[k];
    svg.querySelectorAll(".bar").forEach(b => b.classList.toggle("hi", b.dataset.i == k));
    const c = svg.querySelector(".cursor");
    if (!sl || !c) { tip.style.display = "none"; if (c) c.style.display = "none"; return; }
    const x = (k + .5) * h.bw;
    c.setAttribute("x1", x); c.setAttribute("x2", x); c.style.display = "";
    const v = sl.sum / sl.n, t = h.start + k * BUCKET_S;
    tip.innerHTML = hhmm(t) + "–" + hhmm(t + BUCKET_S) + " · <b>" + fmt1(v) + " °C</b>";
    tip.style.display = "block";
    tip.style.left = Math.max(70, Math.min(h.pw - 70, x)) + "px";
  }
  const hide = () => {
    tip.style.display = "none";
    const c = svg.querySelector(".cursor");
    if (c) c.style.display = "none";
    svg.querySelectorAll(".bar").forEach(b => b.classList.remove("hi"));
  };
  svg.addEventListener("mousemove", e => at(e.clientX));
  svg.addEventListener("mouseleave", hide);
  svg.addEventListener("touchstart", e => at(e.touches[0].clientX), { passive: true });
  svg.addEventListener("touchmove", e => at(e.touches[0].clientX), { passive: true });
  svg.addEventListener("touchend", hide);
}
tooltip(0);
tooltip(1);

window.addEventListener("resize", drawCharts);
loadCurrent();
loadHistory();
loadStatus();
setInterval(loadCurrent, 10000);
setInterval(loadHistory, 300000);
setInterval(loadStatus, 300000);
</script>
</body>
</html>
