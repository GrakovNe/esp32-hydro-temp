name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags give the firmware its version

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          command: >
            idf.py build &&
            esptool.py --chip esp32 merge_bin -o build/hydrotemp.bin
            --flash_mode dio --flash_size 4MB --flash_freq 40m
            0x1000 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0x10000 build/esp32_hydro_temp.bin

      - name: Version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the flasher page
        run: |
          mkdir -p site
          cp flasher/index.html site/
          cp build/hydrotemp.bin site/
          cp build/esp32_hydro_temp.bin site/
          sed "s/__VERSION__/${{ steps.ver.outputs.tag }}/" flasher/manifest.json > site/manifest.json

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            build/hydrotemp.bin
            build/esp32_hydro_temp.bin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
